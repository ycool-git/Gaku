<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小5 毎日ドリル</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root {
  --primary:#1a3a5c; --accent:#e8a020; --green:#3a9e6e; --red:#c0392b;
  --bg:#f0ece4; --card:#fff; --rule:#d0c8bc; --sub:#888;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;color:#222;}

/* ヘッダー */
.app-header{background:var(--primary);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.3);}
.app-title{font-family:'Kaisei Decol',serif;color:var(--accent);font-size:1.05rem;flex:1;min-width:100px;}
.app-header input[type="date"]{padding:6px 8px;border-radius:8px;border:none;font-family:inherit;font-size:.85rem;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;}
.app-header input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);}
.ipad-tip{background:rgba(255,255,255,.1);border-radius:8px;padding:6px 12px;font-size:.72rem;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px;width:100%;}

/* ツールバー */
.toolbar-wrap{background:#edeae4;border-bottom:1px solid var(--rule);padding:8px 16px;}
.toolbar{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tool-label{font-size:.73rem;color:var(--sub);font-weight:700;flex-shrink:0;}
.tool-btn{padding:6px 14px;border-radius:20px;border:2px solid var(--rule);font-family:inherit;font-weight:700;font-size:.8rem;cursor:pointer;background:#fff;color:#555;transition:all .15s;flex-shrink:0;}
.tool-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.tool-btn.eraser-active{background:#7b5c3a;color:#fff;border-color:#7b5c3a;}
.color-palette{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.color-swatch{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .15s;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.color-swatch.active{border-color:#333;transform:scale(1.2);}
.color-swatch.c-navy{background:#1a3a5c;}.color-swatch.c-red{background:#d32f2f;}.color-swatch.c-blue{background:#1565c0;}
.size-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.size-wrap input[type="range"]{width:72px;accent-color:var(--primary);}
.size-dot{background:var(--primary);border-radius:50%;display:inline-block;transition:all .1s;vertical-align:middle;}
.pencil-status{font-size:.7rem;color:var(--sub);background:#fff;border-radius:12px;padding:3px 10px;border:1px solid var(--rule);flex-shrink:0;margin-left:auto;}

/* ボタン */
.btn{padding:7px 14px;border-radius:10px;border:none;font-family:inherit;font-weight:700;font-size:.82rem;cursor:pointer;transition:transform .1s;white-space:nowrap;}
.btn:active{transform:scale(.95);}
.btn-gen{background:var(--accent);color:var(--primary);}
.btn-ans{background:var(--green);color:#fff;}
.btn-ai{background:#7b52ab;color:#fff;}

/* スクロールボタン（固定） */
.scroll-btns{position:fixed;right:14px;bottom:80px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.scroll-btn{width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:1.3rem;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;opacity:.85;}
.scroll-btn:active{opacity:1;transform:scale(.95);}

/* タブ */
.tabs{display:flex;max-width:860px;margin:14px auto 0;padding:0 16px;gap:8px;}
.tab{flex:1;padding:11px;border-radius:12px 12px 0 0;border:none;font-family:inherit;font-weight:700;font-size:.92rem;cursor:pointer;background:rgba(255,255,255,.4);color:var(--sub);transition:background .2s,color .2s;}
.tab.active{background:var(--card);color:var(--primary);}

/* コンテンツ */
.content{max-width:860px;margin:0 auto;padding:0 16px 80px;}
.panel{display:none;}.panel.active{display:block;}
.card{background:var(--card);border-radius:0 0 16px 16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.08);margin-bottom:14px;}
.sec-label{font-size:.72rem;font-weight:700;color:#fff;background:var(--primary);display:inline-block;padding:3px 12px;border-radius:20px;margin-bottom:14px;letter-spacing:.05em;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.88em;line-height:1.15;margin:0 2px;}
.frac-n{border-bottom:1.5px solid currentColor;padding:0 4px 1px;}.frac-d{padding:1px 4px 0;}

/* 計算カード */
.calc-card{border:1.5px solid var(--rule);border-radius:12px;margin-bottom:14px;overflow:hidden;}
.calc-top{display:flex;align-items:center;gap:10px;padding:12px;background:#fafaf8;border-bottom:1px dashed var(--rule);flex-wrap:wrap;}
.calc-num-badge{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.calc-question{font-size:1.05rem;display:flex;align-items:center;gap:4px;flex-shrink:0;}
.equals{color:var(--sub);margin:0 4px;}
.ans-canvas-wrap{position:relative;flex-shrink:0;}
.ans-canvas{width:84px;height:84px;border:2.5px solid var(--primary);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair;display:block;}
.ans-clear-btn{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#bbb;border:none;cursor:pointer;font-size:.65rem;color:#fff;display:flex;align-items:center;justify-content:center;}
.ans-clear-btn:active{background:var(--red);}
.calc-answer-reveal{display:none;font-weight:700;color:var(--red);font-size:1rem;flex-shrink:0;}
body.show-answers .calc-answer-reveal{display:block;}
.calc-scratch-wrap{position:relative;padding:8px 10px;background:#fff;}
.scratch-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.scratch-label{font-size:.68rem;color:var(--sub);}
.scratch-clear-btn{background:none;border:1px solid var(--rule);border-radius:6px;padding:2px 8px;font-size:.68rem;color:var(--sub);cursor:pointer;}
.scratch-clear-btn:active{background:#eee;}
.scratch-canvas{width:100%;height:130px;border:1px solid #eee;border-radius:6px;background:#fffef8;touch-action:none;cursor:crosshair;display:block;}

/* 結果バー */
.result-bar{background:var(--primary);color:#fff;border-radius:14px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.result-date{font-size:.8rem;opacity:.75;}
.cheer-msg{font-family:'Kaisei Decol',serif;color:var(--accent);font-size:.95rem;flex:1;text-align:center;}

/* ===== 漢字 ===== */
.kanji-list{display:flex;flex-direction:column;gap:20px;}
.kanji-item{padding:16px;background:#fafaf8;border-radius:12px;border:1.5px solid var(--rule);}
.kanji-item-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.kanji-num{font-size:.75rem;color:#fff;background:var(--primary);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.kanji-reading{font-size:1.3rem;font-weight:700;color:var(--primary);letter-spacing:.1em;}
.kanji-hint{font-size:.78rem;color:var(--sub);margin-left:auto;}
.kanji-boxes{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px;}
.kanji-box-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
/* ★ 漢字マスを120pxに拡大 */
.kanji-canvas{width:120px;height:120px;border:2px solid var(--rule);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair;display:block;}
.kanji-char-label{font-size:.7rem;color:#bbb;}

.kanji-item-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.kanji-answer-area{display:none;align-items:center;gap:8px;}
body.show-answers .kanji-answer-area{display:flex;}
.kanji-answer-text{font-family:'Kaisei Decol',serif;font-size:1.8rem;color:var(--red);letter-spacing:6px;}
.erase-all-btn{background:none;border:1px solid var(--rule);border-radius:8px;padding:5px 12px;font-size:.72rem;color:var(--sub);cursor:pointer;margin-left:auto;}
.erase-all-btn:active{background:#eee;}

/* AI採点結果バッジ */
.ai-result{display:none;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:.82rem;font-weight:700;}
.ai-result.correct{display:flex;background:#e0f4ea;color:var(--green);border:1.5px solid var(--green);}
.ai-result.incorrect{display:flex;background:#fde8e8;color:var(--red);border:1.5px solid var(--red);}
.ai-result.checking{display:flex;background:#f0f0f0;color:#666;border:1.5px solid #ccc;}

/* AI採点全体バー */
.ai-score-bar{background:var(--card);border:2px solid var(--primary);border-radius:14px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.ai-score-title{font-weight:700;color:var(--primary);font-size:.9rem;}
.ai-score-val{font-family:'Kaisei Decol',serif;font-size:1.5rem;color:var(--primary);}
.ai-score-val em{color:var(--accent);font-style:normal;}

/* 間違い直しパネル */
.retry-panel{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.08);margin-bottom:14px;border:2px solid var(--accent);}
.retry-title{font-family:'Kaisei Decol',serif;font-size:1.1rem;color:var(--primary);margin-bottom:4px;}
.retry-sub{font-size:.78rem;color:var(--sub);margin-bottom:16px;}
.retry-item{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:16px;}
.retry-item:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0;}
.retry-reading{font-size:1.1rem;font-weight:700;color:var(--primary);margin-bottom:8px;letter-spacing:.05em;}
.retry-boxes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.retry-round-label{font-size:.72rem;color:var(--sub);margin-bottom:4px;}
.retry-erase-btn{background:none;border:1px solid var(--rule);border-radius:6px;padding:3px 10px;font-size:.7rem;color:var(--sub);cursor:pointer;}
.retry-check-btn{padding:6px 16px;border-radius:20px;border:none;background:var(--accent);color:var(--primary);font-weight:700;font-size:.8rem;cursor:pointer;margin-top:6px;}

/* ローディングスピナー */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="app-header">
  <div class="app-title">📚 小5 毎日ドリル</div>
  <input type="date" id="dateInput">
  <button class="btn btn-gen" onclick="generate()">🎲 新しい問題</button>
  <button class="btn btn-ans" id="ansBtn" onclick="toggleAnswers()">✅ 答えを見る</button>
  <button class="btn btn-ai"  id="aiBtn"  onclick="runAiScore()" style="display:none">🤖 AI採点</button>
  <div class="ipad-tip">💡 <b>iPad：</b>AirDrop → Safari → ホーム画面に追加。Apple Pencilサイドボタン＝ペン↔消しゴム切替。</div>
</div>

<!-- ツールバー -->
<div class="toolbar-wrap">
  <div class="toolbar">
    <span class="tool-label">ツール：</span>
    <button class="tool-btn active" id="btnPen"    onclick="setTool('pen')">✏️ ペン</button>
    <button class="tool-btn"        id="btnEraser" onclick="setTool('eraser')">🧹 消しゴム</button>
    <span class="tool-label" style="margin-left:4px">色：</span>
    <div class="color-palette">
      <div class="color-swatch c-navy active" id="sw-navy" onclick="setColor('#1a3a5c','navy')" title="紺"></div>
      <div class="color-swatch c-red"         id="sw-red"  onclick="setColor('#d32f2f','red')"  title="赤"></div>
      <div class="color-swatch c-blue"        id="sw-blue" onclick="setColor('#1565c0','blue')" title="青"></div>
    </div>
    <div class="size-wrap" style="margin-left:4px">
      <span class="tool-label">太さ：</span>
      <input type="range" id="sizeSlider" min="2" max="18" value="4" oninput="updateSize()">
      <span class="size-dot" id="sizeDot" style="width:6px;height:6px"></span>
    </div>
    <div class="pencil-status" id="pencilStatus">Apple Pencil: 未検出</div>
  </div>
</div>

<!-- スクロールボタン -->
<div class="scroll-btns">
  <button class="scroll-btn" onclick="scrollPage(-300)" title="上へ">▲</button>
  <button class="scroll-btn" onclick="scrollPage(300)"  title="下へ">▼</button>
</div>

<!-- タブ -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('calc')">🔢 計算（12問）</button>
  <button class="tab"        onclick="switchTab('kanji')">✍️ 漢字（10問）</button>
</div>

<div class="content">

  <!-- 計算パネル -->
  <div class="panel active" id="panel-calc">
    <div class="card">
      <div class="sec-label">計算 ― 答え欄に書いて、下の枠で筆算しよう</div>
      <div id="calcList"></div>
    </div>
    <div class="result-bar">
      <div class="result-date" id="dispDate">―</div>
      <div class="cheer-msg"   id="cheerMsg">「新しい問題」を押してスタート！</div>
    </div>
  </div>

  <!-- 漢字パネル -->
  <div class="panel" id="panel-kanji">
    <!-- AI採点スコアバー（採点後に表示） -->
    <div class="ai-score-bar" id="aiScoreBar" style="display:none">
      <span class="ai-score-title">🤖 AI採点結果</span>
      <span class="ai-score-val" id="aiScoreVal">―</span>
      <button class="btn btn-ai" onclick="startRetry()" id="retryBtn" style="display:none">📝 間違い直しをする</button>
    </div>

    <div class="card">
      <div class="sec-label">漢字 ― マスに指で書こう</div>
      <div class="kanji-list" id="kanjiList"></div>
    </div>

    <!-- 間違い直しパネル（採点後に間違いがあれば表示） -->
    <div class="retry-panel" id="retryPanel" style="display:none">
      <div class="retry-title">📝 間違い直し練習</div>
      <div class="retry-sub">間違えた漢字を3回ずつ練習しよう！</div>
      <div id="retryList"></div>
    </div>

    <div class="result-bar">
      <div class="cheer-msg" style="font-family:inherit;font-size:.9rem;text-align:left">
        書いたら「AI採点」ボタンで採点できます
      </div>
    </div>
  </div>

</div>

<script>
// ===== APIキー入力プロンプト =====
// ファイルを開いたとき1回だけ確認
let API_KEY = localStorage.getItem('drillApiKey') || '';
if (!API_KEY) {
  const k = prompt('AnthropicのAPIキーを入力してください（AI採点に必要です）:\n※入力しなくてもドリルは使えます');
  if (k && k.trim()) {
    API_KEY = k.trim();
    try { localStorage.setItem('drillApiKey', API_KEY); } catch(e){}
  }
}

// ===== スクロール =====
function scrollPage(px) { window.scrollBy({ top: px, behavior: 'smooth' }); }

// ===== ツール =====
let tool='pen', penColor='#1a3a5c', penSize=4, pencilConnected=false;
function setTool(t){
  tool=t;
  document.getElementById('btnPen').className   ='tool-btn'+(t==='pen'?    ' active':'');
  document.getElementById('btnEraser').className='tool-btn'+(t==='eraser'?' eraser-active':'');
}
function setColor(hex,name){
  penColor=hex; if(tool!=='pen') setTool('pen');
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
  document.getElementById('sw-'+name).classList.add('active');
  document.getElementById('sizeDot').style.background=hex;
}
function updateSize(){
  penSize=+document.getElementById('sizeSlider').value;
  const px=Math.max(4,penSize);
  Object.assign(document.getElementById('sizeDot').style,{width:px+'px',height:px+'px'});
}
function toggleTool(){ setTool(tool==='pen'?'eraser':'pen'); }

document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='pen'){
    if(!pencilConnected){ pencilConnected=true; const el=document.getElementById('pencilStatus'); el.textContent='🍎 Apple Pencil 接続中'; el.style.color='#3a9e6e'; }
    if(e.button===1){ e.preventDefault(); toggleTool(); }
  }
},{passive:false});

// ===== 乱数 =====
function seededRand(seed){ let s=seed; return ()=>{ s=(s*1664525+1013904223)&0xffffffff; return (s>>>0)/4294967296; }; }
function getDateSeed(str){ return str.split('-').join('')|0; }
function ri(min,max,r){ return Math.floor(r()*(max-min+1))+min; }
function gcd(a,b){ return b===0?a:gcd(b,a%b); }
function shuffle(arr,r){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// ===== 計算生成 =====
function generateCalcProblems(rand){
  const types=shuffle([0,0,1,1,2,2,3,3,4,4,5,6],rand);
  const gen=[
    ()=>{ const a=ri(12,99,rand),b=ri(2,9,rand); return {q:`${a} × ${b}`,a:`${a*b}`}; },
    ()=>{ const b=ri(2,9,rand),a=b*ri(2,15,rand); return {q:`${a} ÷ ${b}`,a:`${a/b}`}; },
    ()=>{ const a=+(ri(1,9,rand)+'.'+ri(1,9,rand)),b=+(ri(1,9,rand)+'.'+ri(1,9,rand)); return {q:`${a} ＋ ${b}`,a:`${+((a+b).toFixed(2))}`}; },
    ()=>{ const b=+(ri(1,8,rand)+'.'+ri(1,9,rand)),big=+(ri((b|0)+1,9,rand)+'.'+ri(0,9,rand)),sm=Math.min(big,b); return {q:`${Math.max(big,b)} － ${sm}`,a:`${+((Math.max(big,b)-sm).toFixed(2))}`}; },
    ()=>{ const d=ri(3,9,rand),n1=ri(1,d-1,rand),n2=ri(1,d-1,rand),sum=n1+n2,g=gcd(sum,d); const ans=sum===d?'1':(g>1?`${sum/g}/${d/g}`:`${sum}/${d}`); return {q:`${n1}/${d} ＋ ${n2}/${d}`,a:ans}; },
    ()=>{ const d=ri(3,9,rand),n1=ri(2,d,rand),n2=ri(1,n1-1,rand),diff=n1-n2,g=gcd(diff,d); return {q:`${n1}/${d} － ${n2}/${d}`,a:g>1?`${diff/g}/${d/g}`:`${diff}/${d}`}; },
    ()=>{ const a=ri(4,20,rand),b=ri(3,15,rand); return {q:`${a}×${b}cm の面積`,a:`${a*b}cm²`}; },
  ];
  return Array.from({length:12},(_,i)=>gen[types[i]%gen.length]());
}

// ===== 漢字DB =====
const kanjiDB=[
  {reading:'きのう',hint:'昨日のこと',answer:'昨日'},
  {reading:'みらい',hint:'まだ来ていない時間',answer:'未来'},
  {reading:'せいかく',hint:'まちがいがないようす',answer:'正確'},
  {reading:'ぼうけん',hint:'危険をおかす旅や体験',answer:'冒険'},
  {reading:'ひつよう',hint:'どうしてもいること',answer:'必要'},
  {reading:'さんぎょう',hint:'製品をつくる仕事全体',answer:'産業'},
  {reading:'しゅうかく',hint:'田畑の作物をとり入れること',answer:'収穫'},
  {reading:'かんきょう',hint:'生き物をとりまく自然や社会',answer:'環境'},
  {reading:'きょうりょく',hint:'みんなで力をあわせること',answer:'協力'},
  {reading:'じゆう',hint:'自分の思い通りにできること',answer:'自由'},
  {reading:'いけん',hint:'あるテーマへの自分の考え',answer:'意見'},
  {reading:'れきし',hint:'むかしから今までのできごとの記録',answer:'歴史'},
  {reading:'たいせつ',hint:'とても大事に思うようす',answer:'大切'},
  {reading:'けいさん',hint:'数や式をとく作業',answer:'計算'},
  {reading:'しょうらい',hint:'これから先のこと・自分の夢',answer:'将来'},
  {reading:'ちしき',hint:'勉強や経験で得た情報',answer:'知識'},
  {reading:'しんけん',hint:'本気で取り組むようす',answer:'真剣'},
  {reading:'ていねい',hint:'細かいところまで気を配るようす',answer:'丁寧'},
  {reading:'はっけん',hint:'新しいものを見つけること',answer:'発見'},
  {reading:'せつめい',hint:'相手にわかるように話すこと',answer:'説明'},
  {reading:'そうぞう',hint:'新しいものをゼロから作ること',answer:'創造'},
  {reading:'かんしゃ',hint:'ありがとうという気持ち',answer:'感謝'},
  {reading:'ちょうせん',hint:'難しいことに立ち向かうこと',answer:'挑戦'},
  {reading:'ゆうかん',hint:'こわいことにも負けないようす',answer:'勇敢'},
  {reading:'せいちょう',hint:'体や心が大きくなること',answer:'成長'},
];
const cheers=['今日もよくがんばった！🌟','毎日続けるキミはすごい！✨','コツコツが力になる！💪','昨日よりひとつ賢くなった！📖','あきらめないキミが最強！🔥','やればできる！その調子！⭐'];

function fracHtml(s){ return String(s).replace(/(\d+)\/(\d+)/g,(_,n,d)=>`<span class="frac"><span class="frac-n">${n}</span><span class="frac-d">${d}</span></span>`); }

// ===== キャンバス =====
function drawGuides(canvas){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
  ctx.save(); ctx.strokeStyle='#ddd'; ctx.lineWidth=1.5; ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
}

function setupCanvas(canvas,opts){
  const ctx=canvas.getContext('2d');
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(opts&&opts.guides) drawGuides(canvas);
  canvas.style.touchAction='none';
  let drawing=false,last=null;
  function getPos(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}; }
  function onDown(e){ if(e.isPrimary===false) return; e.preventDefault(); e.stopPropagation(); canvas.setPointerCapture(e.pointerId); drawing=true; last=getPos(e); }
  function onMove(e){ if(!drawing||e.isPrimary===false) return; e.preventDefault(); e.stopPropagation(); const p=getPos(e); ctx.save(); if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='rgba(0,0,0,1)';ctx.lineWidth=penSize*4;}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=penColor;const pr=(e.pressure>0)?e.pressure:0.5;ctx.lineWidth=penSize*(0.5+pr);} ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore(); if(opts&&opts.guides&&tool==='eraser') drawGuides(canvas); last=p; }
  function onUp(e){ e.preventDefault(); drawing=false; last=null; }
  canvas.addEventListener('pointerdown',onDown,{passive:false});
  canvas.addEventListener('pointermove',onMove,{passive:false});
  canvas.addEventListener('pointerup',onUp,{passive:false});
  canvas.addEventListener('pointercancel',onUp,{passive:false});
  canvas.addEventListener('touchstart',e=>{ if(e.touches.length===1) e.preventDefault(); },{passive:false});
  canvas.addEventListener('touchmove',e=>{ if(e.touches.length===1) e.preventDefault(); },{passive:false});
}

function clearCanvas(c,guides){ c.getContext('2d').clearRect(0,0,c.width,c.height); if(guides) drawGuides(c); }

function canvasToBase64(canvas){
  // 白背景を合成してJPEG
  const tmp=document.createElement('canvas');
  tmp.width=canvas.width; tmp.height=canvas.height;
  const ctx=tmp.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,tmp.width,tmp.height);
  ctx.drawImage(canvas,0,0);
  return tmp.toDataURL('image/jpeg',0.85).split(',')[1];
}

// ===== 計算レンダリング =====
function renderCalc(problems){
  const list=document.getElementById('calcList'); list.innerHTML='';
  problems.forEach((p,i)=>{
    const card=document.createElement('div'); card.className='calc-card';
    card.innerHTML=`
      <div class="calc-top">
        <div class="calc-num-badge">${i+1}</div>
        <div class="calc-question">${fracHtml(p.q)}<span class="equals">＝</span></div>
        <div class="ans-canvas-wrap">
          <canvas class="ans-canvas" width="168" height="168"></canvas>
          <button class="ans-clear-btn" title="消す">✕</button>
        </div>
        <div class="calc-answer-reveal">${fracHtml(p.a)}</div>
      </div>
      <div class="calc-scratch-wrap">
        <div class="scratch-header"><span class="scratch-label">📝 筆算スペース</span><button class="scratch-clear-btn">消す</button></div>
        <canvas class="scratch-canvas" width="800" height="260"></canvas>
      </div>`;
    list.appendChild(card);
    const ac=card.querySelector('.ans-canvas'),sc=card.querySelector('.scratch-canvas');
    setupCanvas(ac); setupCanvas(sc);
    card.querySelector('.ans-clear-btn').onclick=()=>clearCanvas(ac,false);
    card.querySelector('.scratch-clear-btn').onclick=()=>clearCanvas(sc,false);
  });
}

// ===== 漢字レンダリング =====
// 現在の漢字問題リストを保持（AI採点用）
let currentKanji=[];

function renderKanji(picked){
  currentKanji=picked;
  const list=document.getElementById('kanjiList'); list.innerHTML='';
  picked.forEach((k,i)=>{
    const chars=[...k.answer];
    const boxesHtml=chars.map((_,ci)=>`
      <div class="kanji-box-wrap">
        <canvas class="kanji-canvas" width="240" height="240"></canvas>
        <div class="kanji-char-label">${ci+1}文字目</div>
      </div>`).join('');

    const item=document.createElement('div'); item.className='kanji-item';
    item.innerHTML=`
      <div class="kanji-item-header">
        <div class="kanji-num">${i+1}</div>
        <div class="kanji-reading">${k.reading}</div>
        <div class="kanji-hint">${k.hint}</div>
      </div>
      <div class="kanji-boxes">${boxesHtml}</div>
      <div class="kanji-item-footer">
        <div class="kanji-answer-area">
          <span style="font-size:.8rem;color:var(--sub)">正解：</span>
          <div class="kanji-answer-text">${k.answer}</div>
        </div>
        <div class="ai-result" id="air-${i}"></div>
        <button class="erase-all-btn">全消し</button>
      </div>`;
    list.appendChild(item);
    item.querySelectorAll('.kanji-canvas').forEach(c=>setupCanvas(c,{guides:true}));
    item.querySelector('.erase-all-btn').onclick=()=>item.querySelectorAll('.kanji-canvas').forEach(c=>clearCanvas(c,true));
  });
}

// ===== AI採点 =====
async function runAiScore(){
  if(!API_KEY){
    const k=prompt('APIキーを入力してください：');
    if(!k||!k.trim()){ alert('APIキーが必要です'); return; }
    API_KEY=k.trim();
    try{ localStorage.setItem('drillApiKey',API_KEY); }catch(e){}
  }

  const btn=document.getElementById('aiBtn');
  btn.disabled=true; btn.textContent='🤖 採点中…';

  const items=document.querySelectorAll('.kanji-item');
  let correct=0; const wrongIdx=[];

  for(let i=0;i<currentKanji.length;i++){
    const k=currentKanji[i];
    const resultEl=document.getElementById(`air-${i}`);
    resultEl.className='ai-result checking';
    resultEl.innerHTML=`<span class="spinner"></span> 採点中…`;

    // 各文字のキャンバスをまとめて1枚の画像にする
    const canvases=[...items[i].querySelectorAll('.kanji-canvas')];
    // 横に並べた合成キャンバスを作成
    const CELL=240, merged=document.createElement('canvas');
    merged.width=CELL*canvases.length; merged.height=CELL;
    const mctx=merged.getContext('2d');
    mctx.fillStyle='#fff'; mctx.fillRect(0,0,merged.width,merged.height);
    canvases.forEach((c,ci)=>mctx.drawImage(c,ci*CELL,0));
    const b64=merged.toDataURL('image/jpeg',0.85).split(',')[1];

    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:100,
          messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
            {type:'text',text:`この画像は小学5年生が「${k.reading}」という読みがなに対して漢字を手書きしたものです。正解は「${k.answer}」です。画像に書かれた漢字が正解と一致しているか判定してください。「正解」または「不正解」の一言だけ答えてください。`}
          ]}]
        })
      });
      const data=await res.json();
      const txt=(data.content&&data.content[0]&&data.content[0].text)||'';
      const isOk=txt.includes('正解')&&!txt.includes('不正解');
      if(isOk){ correct++; resultEl.className='ai-result correct'; resultEl.innerHTML='✅ 正解！'; }
      else { wrongIdx.push(i); resultEl.className='ai-result incorrect'; resultEl.innerHTML=`❌ 不正解 (正解：${k.answer})`; }
    }catch(err){
      resultEl.className='ai-result incorrect'; resultEl.innerHTML='⚠️ エラー';
      console.error(err);
    }
  }

  // スコア表示
  const bar=document.getElementById('aiScoreBar'); bar.style.display='flex';
  document.getElementById('aiScoreVal').innerHTML=`<em>${correct}</em> / ${currentKanji.length} 問正解`;
  btn.disabled=false; btn.textContent='🤖 AI採点';

  // 間違い直しボタン
  if(wrongIdx.length>0){
    const rb=document.getElementById('retryBtn'); rb.style.display='';
    rb.onclick=()=>startRetry(wrongIdx);
  }
}

// ===== 間違い直し練習 =====
function startRetry(wrongIdx){
  const panel=document.getElementById('retryPanel'); panel.style.display='';
  const list=document.getElementById('retryList'); list.innerHTML='';
  panel.scrollIntoView({behavior:'smooth'});

  wrongIdx.forEach(idx=>{
    const k=currentKanji[idx];
    const chars=[...k.answer];
    const ROUNDS=3;

    const item=document.createElement('div'); item.className='retry-item';

    // 3ラウンド分のマスを生成
    let roundsHtml='';
    for(let r=0;r<ROUNDS;r++){
      const boxHtml=chars.map((_,ci)=>`
        <div class="kanji-box-wrap">
          <canvas class="kanji-canvas" width="240" height="240" data-round="${r}" data-char="${ci}"></canvas>
          <div class="kanji-char-label">${ci+1}文字目</div>
        </div>`).join('');
      roundsHtml+=`
        <div class="retry-round-label">${r+1}回目</div>
        <div class="retry-boxes" id="retry-boxes-${idx}-${r}">${boxHtml}</div>
        <button class="retry-erase-btn" data-round="${r}">この回を消す</button>`;
    }

    item.innerHTML=`
      <div class="retry-reading">「${k.reading}」＝ ？（正解：${k.answer}）</div>
      ${roundsHtml}`;
    list.appendChild(item);

    // キャンバスセットアップ
    item.querySelectorAll('.kanji-canvas').forEach(c=>setupCanvas(c,{guides:true}));
    // 各回の消すボタン
    item.querySelectorAll('.retry-erase-btn').forEach(btn=>{
      const r=+btn.dataset.round;
      btn.onclick=()=>{
        item.querySelectorAll(`canvas[data-round="${r}"]`).forEach(c=>clearCanvas(c,true));
      };
    });
  });
}

// ===== 生成 =====
function generate(){
  const dateStr=document.getElementById('dateInput').value||today();
  document.getElementById('dateInput').value=dateStr;
  const [y,m,d]=dateStr.split('-');
  document.getElementById('dispDate').textContent=`${y}年${m}月${d}日`;
  const rand=seededRand(getDateSeed(dateStr));
  renderCalc(generateCalcProblems(rand));
  renderKanji(shuffle([...kanjiDB],rand).slice(0,10));
  document.getElementById('cheerMsg').textContent=cheers[Math.floor(rand()*cheers.length)];
  answersOn=false;
  document.body.classList.remove('show-answers');
  document.getElementById('ansBtn').textContent='✅ 答えを見る';
  document.getElementById('aiBtn').style.display='';
  document.getElementById('aiScoreBar').style.display='none';
  document.getElementById('retryPanel').style.display='none';
  setTool('pen'); setColor('#1a3a5c','navy');
}

function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

updateSize();
document.getElementById('dateInput').value=today();
generate();
</script>
